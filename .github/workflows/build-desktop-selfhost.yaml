# Compila el cliente de escritorio de Fluxer para Windows x64 aplicando tus
# parches SOBRE el codigo de upstream, sin necesidad de sincronizar el fork.
#
# En tu fork solo viven dos ficheros:
#   .github/workflows/build-desktop-selfhost.yaml   <- este
#   patches/selfhost.patch                          <- tus cambios
# Upstream nunca toca esos dos, asi que nunca hay conflicto de merge.
#
# El resultado es un instalador (Setup.exe): tus amigos lo ejecutan una vez
# y les queda como una app normal, con icono en el menu inicio y escritorio.
#
# Uso: Actions -> "build desktop (self-host)" -> Run workflow.

name: build desktop (self-host)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag o rama de upstream a compilar
        required: true
        default: main
        type: string
      channel:
        description: Canal del build (determina el nombre de la carpeta de perfil)
        required: false
        type: choice
        options:
          - stable
          - canary
        default: stable

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      BUILD_CHANNEL: ${{ inputs.channel }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      PUBLIC_RELEASE_CHANNEL: ${{ inputs.channel }}
      PUBLIC_BUILD_VERSION: selfhost-${{ inputs.ref }}
      BUILD_VERSION: selfhost-${{ inputs.ref }}
      FLUXER_DESKTOP_BUILD_VARIANT: default
      FLUXER_WINDOWS_GAME_CAPTURE_MODULE_ENABLED: "false"

    steps:
      - name: Permitir rutas largas en git
        run: git config --global core.longpaths true

      # Tu fork: solo aporta el fichero de parches.
      - name: Checkout de tu fork (parches)
        uses: actions/checkout@v4
        with:
          path: overlay

      # Codigo de upstream, siempre limpio y al dia. Tu fork no necesita
      # estar sincronizado para nada.
      - name: Checkout de upstream
        uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: ${{ inputs.ref }}
          path: source

      # Si esto falla, es que upstream ha tocado las lineas que parcheas.
      # Es el unico momento en que tienes que intervenir a mano.
      - name: Normalizar el parche a finales de linea Unix
        shell: pwsh
        run: |
          $p = "overlay/patches/selfhost.patch"
          $t = [System.IO.File]::ReadAllText($p) -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText($p, $t)

      - name: Aplicar parches
        working-directory: source
        run: git apply --3way --ignore-whitespace --verbose ../overlay/patches/selfhost.patch

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust 1.93.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: x86_64-pc-windows-msvc

      - name: Entorno MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: amd64

      - name: Instalar dependencias del monorepo
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build del cliente
        working-directory: source/fluxer_desktop
        run: pnpm build

      # --win nsis genera un instalador de verdad. La config del repo solo
      # trae el target 'dir' porque upstream empaqueta con Velopack aparte.
      - name: Generar instalador
        working-directory: source/fluxer_desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win nsis --x64

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-setup-${{ inputs.channel }}-win-x64
          path: source/fluxer_desktop/dist-electron/*.exe
          retention-days: 14
